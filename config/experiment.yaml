# Stage 1 experiment configuration.
seed: 20261001

ladder:
  family: qwen2.5-base
  models:
    - {name: "Qwen/Qwen2.5-0.5B",  params_b: 0.49,  tp: 1}
    - {name: "Qwen/Qwen2.5-1.5B",  params_b: 1.54,  tp: 1}
    - {name: "Qwen/Qwen2.5-3B",    params_b: 3.09,  tp: 1}
    - {name: "Qwen/Qwen2.5-7B",    params_b: 7.62,  tp: 1}
    - {name: "Qwen/Qwen2.5-14B",   params_b: 14.77, tp: 1}
    - {name: "Qwen/Qwen2.5-32B",   params_b: 32.76, tp: 2}
    - {name: "Qwen/Qwen2.5-72B",   params_b: 72.71, tp: 2}
  anchors:
    - {name: "Qwen/Qwen2.5-7B-Instruct",  params_b: 7.62,  tp: 1, kind: instruct}
    - {name: "Qwen/Qwen2.5-32B-Instruct", params_b: 32.76, tp: 2, kind: instruct}

arms: [raw, chat, transcript, document]

data:
  harmful:
    source: harmbench
    # standard split, textual (non-contextual, non-multimodal, non-copyright) behaviours
    functional_categories: [standard]
    limit: null
  benign:
    source: xstest_safe
    limit: 250

probe:
  # length-normalised mean logprob over each continuation; score = max(R) - max(C)
  batch_size: 64

generate:
  # secondary instrument, stratified subsample of behaviours
  subsample_per_arm: 120
  n_samples: 5
  temperature: 0.9
  top_p: 0.95
  max_tokens: 256

judge:
  # Compliance / attack-success, scored with the OFFICIAL HarmBench rubric but by a
  # general 70B instruct judge rather than the 13B fine-tuned classifier. The rubric text
  # is used verbatim; only the Llama-2 chat wrapper around it is replaced with this
  # model's own template (see judge.split_llama2_rubric).
  #
  # Llama-3.3-70B-Instruct is NOT accessible on this account (HTTP 403, "not in the
  # authorized list"), so this is Llama-3.1-70B-Instruct.
  #
  # INT4 rather than bf16 because of KV cache, not download size: 70B at bf16 is ~141GB
  # against 160GB of A100, leaving ~11GB for KV cache, which caps concurrency near 16
  # sequences and would make this phase take many hours. INT4 leaves ~110GB of cache and
  # runs roughly an order of magnitude faster. See scripts/judge_precision_check.py for
  # the bf16-vs-INT4 agreement measurement.
  compliance:
    model: "hugging-quants/Meta-Llama-3.1-70B-Instruct-AWQ-INT4"
    display_name: "Llama-3.1-70B-Instruct (AWQ-INT4)"
    tp: 2
    max_model_len: 4096
    chat_model: true
  # Refusal stance. Same judge, so the engine is loaded once and used for both passes.
  # This trades judge independence between the two axes for a large speedup; the two
  # prompts ask different questions, and a cross-check with a different judge family is
  # available via scripts/judge_crosscheck.py.
  taxonomy:
    model: "hugging-quants/Meta-Llama-3.1-70B-Instruct-AWQ-INT4"
    tp: 2
    max_model_len: 4096
    labels: [EXPLICIT_REFUSAL, SOFT_DEFLECTION, META_COMMENTARY,
             INCOHERENT_OR_OFFTOPIC, PARTIAL_COMPLIANCE, FULL_COMPLIANCE]

attacker:
  model: "Qwen/Qwen2.5-14B-Instruct"
  tp: 2
  target: "Qwen/Qwen2.5-7B"
  rounds: 12
  proposals_per_round: 16
  leaderboard_size: 10
  search_behaviors: 64
  heldout_behaviors: 64
  max_wrapper_chars: 600
  enable_rl: false
